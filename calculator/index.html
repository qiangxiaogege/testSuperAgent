<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>计算器</title>
  <link rel="stylesheet" href="style.css">
  <script src="calculator.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="计算器">
    <div class="display" id="display" aria-live="polite">0</div>
    <div class="keys">
      <button type="button" class="key key--function" data-key="clear" aria-label="清除">C</button>
      <button type="button" class="key key--operator" data-key="/" aria-label="除以">÷</button>
      <button type="button" class="key key--operator" data-key="*" aria-label="乘以">×</button>
      <button type="button" class="key key--operator" data-key="-" aria-label="减去">-</button>

      <button type="button" class="key" data-key="7">7</button>
      <button type="button" class="key" data-key="8">8</button>
      <button type="button" class="key" data-key="9">9</button>
      <button type="button" class="key key--operator" data-key="+" aria-label="加上">+</button>

      <button type="button" class="key" data-key="4">4</button>
      <button type="button" class="key" data-key="5">5</button>
      <button type="button" class="key" data-key="6">6</button>
      <button type="button" class="key key--equals" data-key="equals" aria-label="等于">=</button>

      <button type="button" class="key" data-key="1">1</button>
      <button type="button" class="key" data-key="2">2</button>
      <button type="button" class="key" data-key="3">3</button>

      <button type="button" class="key key--zero" data-key="0">0</button>
      <button type="button" class="key" data-key="." aria-label="小数点">.</button>
    </div>
  </main>
</body>
</html>
