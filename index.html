<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      background: #f2f4f7;
      color: #1f2933;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.5rem;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
    }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    #todo-input {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.75rem;
      font: inherit;
      color: inherit;
      background: #ffffff;
      border: 1px solid #bcccdc;
      border-radius: 6px;
    }

    #todo-input:focus {
      outline: 2px solid #2563eb;
      outline-offset: 1px;
    }

    button {
      padding: 0.5rem 1rem;
      font: inherit;
      color: #ffffff;
      background: #2563eb;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #todo-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #todo-list > li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d9e2ec;
      border-radius: 6px;
    }

    #todo-list > li input[type="checkbox"] {
      flex: none;
      width: 1rem;
      height: 1rem;
      margin: 0;
    }

    #todo-list > li.completed {
      color: #7b8794;
    }

    #todo-list > li.completed .todo-text,
    #todo-list > li.completed span {
      text-decoration: line-through;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    #todo-list > li button {
      flex: none;
      padding: 0.25rem 0.6rem;
      font: inherit;
      color: #b42318;
      background: transparent;
      border: 1px solid #d9e2ec;
      border-radius: 6px;
      cursor: pointer;
    }

    #todo-list > li button:hover {
      background: #fdecea;
    }
  </style>
</head>
<body>
  <main>
    <h1>TODO</h1>
    <form>
      <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
  </main>
  <script></script>
</body>
</html>
